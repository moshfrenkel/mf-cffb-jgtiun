<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1413">
<title>קופסת 08:20 · הדלת נסגרה, אימון נפתח</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* ===== אתגר 30 — chalk board-game ledger =====
   roll: ledger top-to-bottom · perforated receipt slips · type-to-unlock stamp
   · colliding type · vintage board-game box · pulse-sync (2s beat everywhere) */
:root{
  --bg:#0c1413; --board:#101b1a; --paper:#152220; --paper2:#182724;
  --chalk:#ece5d4; --dim:#8fa39d; --tq:#2BBCB3; --or:#F4A261;
  --beat:2s;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:'Heebo',sans-serif; color:var(--chalk); background:var(--bg);
  min-height:100vh; overflow-x:hidden;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%, #16302d55, transparent 60%);
}
h1,h2,.num,.big{font-family:'Secular One',sans-serif; font-weight:400}
svg{display:block}
button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer}
input{font-family:inherit}
#app{max-width:520px; margin:0 auto; padding:0 0 90px}

/* — box lid — */
.lid{position:relative; padding:34px 20px 10px; overflow:hidden}
.lid .frame{position:absolute; inset:10px; border:2px solid var(--chalk); opacity:.25; pointer-events:none}
.lid .frame::after{content:''; position:absolute; inset:5px; border:1px solid var(--chalk); opacity:.6}
.collide{position:relative; height:118px}
.collide .n30{
  position:absolute; top:-28px; left:6px; font-size:150px; line-height:1;
  color:transparent; -webkit-text-stroke:2px var(--tq); opacity:.85;
  transform:rotate(-7deg); animation:breath var(--beat) ease-in-out infinite;
}
.collide .word{
  position:absolute; top:34px; right:14px; font-size:58px; color:var(--chalk);
  text-shadow:3px 3px 0 var(--bg), 5px 5px 0 var(--or); transform:rotate(1.5deg); z-index:2;
}
.lid .sub{margin:2px 16px 0; color:var(--dim); font-size:14px; transform:rotate(-1deg)}
.lid .edition{display:inline-block; margin:10px 14px 0; padding:3px 10px; border:1px dashed var(--or);
  color:var(--or); font-size:12px; transform:rotate(-2deg)}
@keyframes breath{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(-7deg) scale(1.035)}}

/* — receipt slips (perforated) — */
.slip{position:relative; margin:26px 12px 0; background:var(--paper); padding:20px 18px 24px;
  box-shadow:0 10px 30px #0009;}
.slip::before,.slip::after{content:''; position:absolute; left:0; right:0; height:12px;
  background:radial-gradient(circle 5px at 11px 6px, var(--bg) 97%, transparent) repeat-x;
  background-size:22px 12px}
.slip::before{top:-6px}
.slip::after{bottom:-6px; transform:scaleY(-1)}
.slip .rip{position:absolute; top:8px; left:-4px; width:26px; height:26px; border:2px solid var(--or);
  border-radius:50%; border-left-color:transparent; border-bottom-color:transparent; transform:rotate(33deg); opacity:.7}
.today-head{display:flex; align-items:flex-end; gap:14px}
.today-head .num{font-size:74px; line-height:.9; color:var(--or)}
.today-head .of{color:var(--dim); font-size:13px; margin-bottom:8px}
.today-head .dtype{margin-inline-start:auto; text-align:left; margin-bottom:6px}
.today-head .dtype b{display:block; color:var(--tq); font-size:20px; font-family:'Secular One'}
.today-head .dtype span{color:var(--dim); font-size:12px}
.dashline{border:none; border-top:1px dashed #ece5d433; margin:14px 0}
.startbtn{display:flex; width:100%; align-items:center; justify-content:space-between;
  border:2px solid var(--tq); padding:16px 18px; font-size:24px; font-family:'Secular One';
  color:var(--chalk); background:linear-gradient(120deg, #2bbcb322, transparent 55%);
  animation:pulseline var(--beat) ease-in-out infinite}
.startbtn svg{width:44px; height:34px}
.startbtn:active{transform:translateY(2px)}
@keyframes pulseline{0%,100%{border-color:var(--tq)}50%{border-color:#2bbcb355}}
.slip .stamped-note{color:var(--or); font-size:15px; padding:8px 2px 0}
.musicrow{display:flex; align-items:center; gap:10px; margin-top:14px; color:var(--dim); font-size:14px}
.musicrow button{border-bottom:1px dashed var(--tq); color:var(--tq); padding-bottom:2px; font-size:14px}
.musicwrap{margin-top:10px; display:none}
.musicwrap.on{display:block}
.musicwrap iframe{width:100%; height:80px; border:0}
.musicwrap input{width:100%; margin-top:8px; background:var(--bg); border:1px dashed #ece5d433;
  color:var(--chalk); padding:8px 10px; font-size:13px}

/* — rulebook — */
.rules{margin:30px 22px 0 34px; transform:rotate(-.6deg); border:1px solid #ece5d426; padding:14px 16px;
  font-size:13.5px; color:var(--dim); line-height:1.75; position:relative}
.rules h2{color:var(--chalk); font-size:16px; margin-bottom:6px}
.rules .rl{display:flex; gap:8px}
.rules .rl i{font-style:normal; color:var(--or); font-family:'Secular One'; min-width:16px}
.rules::after{content:''; position:absolute; top:-7px; left:24px; width:52px; height:14px;
  background:#ece5d41c; transform:rotate(-4deg)}

/* — ledger tape — */
.ledger{margin:34px 0 0; position:relative}
.ledger .tapehead{display:flex; align-items:baseline; gap:12px; padding:0 22px 10px}
.ledger .tapehead h2{font-size:22px}
.tally{margin-inline-start:auto}
.row{display:flex; align-items:center; gap:12px; padding:10px 22px; border-bottom:1px dashed #ece5d41f;
  position:relative; min-height:52px}
.row .dnum{font-family:'Secular One'; font-size:20px; width:34px; color:var(--dim)}
.row .dname{font-size:14px; color:var(--dim); flex:1}
.row.done .dname,.row.done .dnum{color:var(--chalk)}
.row.today{background:linear-gradient(90deg,#2bbcb31c,transparent 70%)}
.row.today .dnum{color:var(--tq); font-size:26px}
.row.today .youare{color:var(--tq); font-size:12px; border:1px solid var(--tq); padding:2px 8px; transform:rotate(-2deg)}
.row.locked{opacity:.42}
.row .stamp{transform:rotate(-9deg); width:64px; flex:none}
.row .ddate{font-size:11px; color:var(--dim)}
.row.patched .dname{color:var(--or)}
/* dead-zone patch (the joker) */
.deadzone{position:relative; margin:2px 14px; padding:14px 16px; border:2px solid var(--or);
  transform:rotate(-2.2deg); background:repeating-linear-gradient(45deg,#f4a26114 0 8px,transparent 8px 16px)}
.deadzone b{font-family:'Secular One'; color:var(--or); font-size:16px; display:block}
.deadzone span{font-size:12.5px; color:var(--dim); line-height:1.5; display:block}
.deadzone .tape{position:absolute; width:56px; height:14px; background:#ece5d42a}
.deadzone .tape.t1{top:-8px; right:18px; transform:rotate(6deg)}
.deadzone .tape.t2{bottom:-8px; left:14px; transform:rotate(-5deg)}
.deadzone button{margin-top:8px; color:var(--or); border-bottom:1px dashed var(--or); font-size:13px}

/* — player — */
#player{position:fixed; inset:0; background:var(--bg); display:none; z-index:50; overflow:hidden}
#player.on{display:flex; flex-direction:column}
#player .halo{position:absolute; inset:-20%; background:radial-gradient(circle at 50% 46%, #2bbcb318, transparent 55%);
  animation:halo var(--beat) ease-in-out infinite; pointer-events:none}
#player.rest .halo{background:radial-gradient(circle at 50% 46%, #f4a26118, transparent 55%)}
@keyframes halo{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ptop{display:flex; justify-content:space-between; align-items:center; padding:16px 18px 0; font-size:13px; color:var(--dim)}
.ptop .quit{color:var(--dim); border-bottom:1px dashed var(--dim)}
.ptape{height:5px; background:#ece5d41a; margin:12px 0 0}
.ptape i{display:block; height:100%; background:var(--tq); width:0%}
.pmain{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; position:relative; padding:0 18px}
.pcount{font-family:'Secular One'; font-size:110px; line-height:1; color:var(--chalk);
  animation:breath2 var(--beat) ease-in-out infinite}
#player.rest .pcount{color:var(--or)}
@keyframes breath2{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.pex{font-size:30px; font-family:'Secular One'; text-align:center; color:var(--tq)}
#player.rest .pex{color:var(--or)}
.pcue{font-size:15px; color:var(--dim); text-align:center; min-height:22px}
.pfig{width:190px; height:190px; margin-top:6px}
.pfig svg{width:100%; height:100%}
.pnext{position:absolute; bottom:14px; right:18px; left:18px; display:flex; justify-content:space-between;
  color:var(--dim); font-size:13px; border-top:1px dashed #ece5d426; padding-top:10px}
.pbtns{display:flex; gap:12px; padding:0 18px 26px}
.pbtns button{flex:1; border:2px solid #ece5d438; padding:14px; font-size:16px; font-family:'Secular One'; color:var(--chalk)}
.pbtns button.go{border-color:var(--tq)}

/* — done / stamp screen — */
#done{position:fixed; inset:0; background:var(--bg); display:none; z-index:60; overflow-y:auto}
#done.on{display:block}
.donewrap{max-width:520px; margin:0 auto; padding:40px 0 60px}
.bigstamp{width:150px; margin:8px auto 0; transform:rotate(-11deg); opacity:0; transition:opacity .5s, transform .5s}
.bigstamp.show{opacity:1; transform:rotate(-7deg) scale(1)}
.sumline{display:flex; justify-content:space-between; font-size:14px; color:var(--dim); padding:6px 2px; border-bottom:1px dashed #ece5d422}
.sumline b{color:var(--chalk); font-weight:600}
.signrow{margin-top:18px}
.signrow label{font-size:14px; color:var(--dim); display:block; margin-bottom:8px}
.signrow input{width:100%; background:transparent; border:none; border-bottom:2px dashed var(--tq);
  color:var(--chalk); font-size:26px; font-family:'Secular One'; padding:6px 4px; outline:none}
.stampbtn{display:block; width:100%; margin-top:18px; border:2px solid var(--or); color:var(--or);
  font-family:'Secular One'; font-size:22px; padding:14px; opacity:.35; pointer-events:none}
.stampbtn.ready{opacity:1; pointer-events:auto; animation:pulseline var(--beat) infinite}
.extra{margin-top:16px; display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--dim)}
.extra .chk{width:26px; height:26px; border:2px solid var(--tq); flex:none; display:grid; place-items:center}
.extra .chk svg{width:18px; height:18px; opacity:0}
.extra.on .chk svg{opacity:1}
.extra input{width:80px; background:transparent; border:none; border-bottom:1px dashed var(--or);
  color:var(--chalk); font-size:18px; text-align:center; outline:none}
.backhome{display:block; margin:26px auto 0; color:var(--dim); border-bottom:1px dashed var(--dim); font-size:15px}
.confetti-note{text-align:center; color:var(--tq); font-size:15px; margin-top:14px; min-height:20px}

/* — bottom nav (chalk tab strip) — */
#nav{position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--board);
  border-top:1px dashed #ece5d433; box-shadow:0 -8px 24px #0008}
#nav .inner{max-width:520px; margin:0 auto; display:flex}
#nav button{flex:1; padding:13px 4px 16px; font-family:'Secular One'; font-size:15px; color:var(--dim); position:relative}
#nav button.on{color:var(--tq)}
#nav button.on::after{content:''; position:absolute; bottom:9px; left:26%; right:26%; height:3px;
  background:var(--tq); transform:rotate(-1.6deg)}
#nav button:nth-child(2).on::after{transform:rotate(1.4deg); background:var(--or)}
#nav button:nth-child(2).on{color:var(--or)}

/* — day peek overlay — */
#peek{position:fixed; inset:0; background:var(--bg); display:none; z-index:55; overflow-y:auto}
#peek.on{display:block}
.peekwrap{max-width:520px; margin:0 auto; padding:30px 0 70px}
.exline{display:flex; align-items:center; gap:12px; padding:8px 2px; border-bottom:1px dashed #ece5d41f}
.exline .fig{width:52px; height:52px; flex:none}
.exline .fig svg{width:100%; height:100%}
.exline .xtxt{flex:1; min-width:0}
.exline b{display:block; font-size:15px; color:var(--chalk); font-weight:600}
.exline span{font-size:12.5px; color:var(--dim); line-height:1.4}
.exline .secs{margin-inline-start:auto; font-family:'Secular One'; color:var(--tq); font-size:15px; flex:none; white-space:nowrap}
.exline.dimmed{opacity:.4}
.sechead{font-family:'Secular One'; font-size:15px; color:var(--or); margin:18px 0 4px; transform:rotate(-.8deg)}
.peeknote{font-size:12.5px; color:var(--dim); margin-top:12px; line-height:1.6}
.peekstatus{display:inline-block; margin-top:8px; padding:3px 10px; border:1px dashed var(--tq);
  color:var(--tq); font-size:12.5px; transform:rotate(-1.5deg)}

/* — dashboard — */
.bignum{font-family:'Secular One'; font-size:64px; line-height:1; color:var(--tq)}
.bignum small{font-size:22px; color:var(--dim)}
.dtape{height:8px; background:#ece5d41a; margin:12px 0 4px; position:relative}
.dtape i{display:block; height:100%; background:linear-gradient(90deg,var(--tq),#2bbcb388)}
.dtape span{position:absolute; top:-4px; font-size:10px; color:var(--dim)}
.statrow{display:flex; justify-content:space-between; align-items:baseline; padding:9px 2px; border-bottom:1px dashed #ece5d422; font-size:14px; color:var(--dim)}
.statrow b{font-family:'Secular One'; font-size:20px; color:var(--chalk); font-weight:400}
.statrow b.tqv{color:var(--tq)} .statrow b.orv{color:var(--or)}
.wchart{margin-top:10px}
.wchart svg{width:100%; height:auto}
.dashempty{color:var(--dim); font-size:13.5px; padding:10px 0 4px; line-height:1.6}

/* — library — */
.libgroup{margin-top:22px}
.libgroup h3{font-family:'Secular One'; font-size:17px; color:var(--tq); transform:rotate(-.7deg);
  display:flex; align-items:baseline; gap:8px}
.libgroup h3 small{font-size:12px; color:var(--dim); font-family:'Heebo'}
.wkbadge{font-size:11px; color:var(--or); border:1px dashed var(--or); padding:1px 7px; white-space:nowrap; transform:rotate(-2deg)}
.wkbadge.open{color:var(--tq); border-color:var(--tq)}
.dtypeline{display:flex; align-items:baseline; gap:10px; padding:8px 2px; border-bottom:1px dashed #ece5d41f; font-size:13.5px}
.dtypeline i{font-style:normal; font-family:'Secular One'; color:var(--or); min-width:18px}
.dtypeline b{color:var(--chalk); font-weight:600; min-width:86px}
.dtypeline span{color:var(--dim); flex:1}
.dtypeline .secs{color:var(--tq); font-family:'Secular One'; white-space:nowrap}

/* — video demo modal — */
#vid{position:fixed; inset:0; background:#000d; display:none; z-index:70;
  align-items:center; justify-content:center; padding:16px}
#vid.on{display:flex}
#vid .box{width:100%; max-width:480px; background:var(--board); padding:12px 12px 14px;
  box-shadow:0 24px 70px #000; border:1px solid #ece5d422; transform:rotate(-.5deg)}
#vid .vhead{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:0 2px 10px}
#vid .vhead b{font-family:'Secular One'; font-size:17px; color:var(--chalk); font-weight:400}
#vid .vhead button{color:var(--or); font-size:14px; border:1px dashed var(--or); padding:3px 10px; flex:none}
#vid .frame16{position:relative; width:100%; padding-top:56.25%; background:#000}
#vid iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
#vid .vlink{display:inline-block; margin-top:10px; color:var(--dim); font-size:12.5px;
  border-bottom:1px dashed var(--dim); text-decoration:none}
.playtag{flex:none; width:30px; height:30px; cursor:pointer; opacity:.85}
.playtag svg{width:100%; height:100%}
.pdemo{margin-top:6px; color:var(--tq); font-size:13.5px; border-bottom:1px dashed var(--tq); padding-bottom:1px}

/* — spotify row — */
.spopen{display:inline-block; border:1px solid var(--tq); color:var(--tq); padding:4px 12px;
  font-size:13px; text-decoration:none; transform:rotate(-1deg); white-space:nowrap}
.spnote{font-size:12px; color:var(--dim); line-height:1.6; margin-top:8px}

@media(min-width:520px){ .collide .n30{font-size:170px} }

/* ===== 08:20 box — only what the new program needs on top of the challenge-30 sheet ===== */
.collide .n30.clock{font-size:92px; top:-14px; left:4px; -webkit-text-stroke-color:var(--or); direction:ltr}
.collide .word.w0820{top:30px}
#nav button[data-v=home]{color:var(--or)}
#nav button[data-v=home].on::after{background:var(--or); transform:rotate(1.4deg)}
#nav button:nth-child(2).on{color:var(--tq)}
#nav button:nth-child(2).on::after{background:var(--tq)}
.pcount.long{font-size:96px}
.ptop .ptot{color:var(--chalk); font-family:'Secular One'; font-size:14px}
.plist{width:100%; max-width:380px; margin-top:4px}
.plist .exline .fig{width:58px; height:58px}
.roundbtn{margin-top:12px; width:100%; max-width:380px; border:2px solid var(--tq); padding:11px 16px;
  font-family:'Secular One'; font-size:18px; color:var(--chalk); display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(120deg,#2bbcb322,transparent 55%)}
.roundbtn b{font-size:28px; color:var(--tq); font-weight:400}
.roundbtn:active{transform:translateY(2px)}
.elbow{display:inline-block; margin-top:10px; color:var(--or); border-bottom:1px dashed var(--or); font-size:13px; padding-bottom:1px}
.pmain .elbow{margin-top:8px}
.wkhead{padding:16px 22px 4px; font-family:'Secular One'; font-size:15px; color:var(--or)}
.wkhead small{display:block; font-family:'Heebo'; font-size:12px; color:var(--dim)}
.row.sat{min-height:34px; padding:6px 22px; opacity:.38}
.row .score{font-family:'Secular One'; color:var(--tq); font-size:14px; white-space:nowrap}
.restfig{width:150px; height:150px; margin:6px auto 0}
.restfig svg{width:100%; height:100%}
.extra input.wide{width:92px}
.scorenote{font-size:12.5px; color:var(--dim); margin-top:8px}
@media(max-height:700px){ .pcount.long{font-size:72px} .plist .exline{padding:5px 2px} .pfig{width:150px;height:150px} }
</style>

<div id="app"></div>

<script id="logic">
/* ================== קופסת 08:20 · program logic (pure, no DOM) ==================
   source of truth: data/training/box-0820.md
   6 days Sun-Fri, Saturday rest, 6 weeks 12.11-23.12.2026 = 36 sessions.
   weeks 1-3 are the verified base (DAYS). weeks 4-6 are written session by session (PH2).
   every session: 180s rope warmup + 600s work + 120s tennis-ball release = 15:00. */
const START_ISO='2026-11-12', END_ISO='2026-12-23', NW=6;
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;   /* local date, never UTC */
const dateOf=iso=>new Date(iso+'T12:00:00');
const addDays=(iso,n)=>{const d=dateOf(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const todayStr=()=>isoOf(new Date());
const dowOf=iso=>dateOf(iso).getDay();
const dayDiff=(a,b)=>Math.round((dateOf(a)-dateOf(b))/864e5);
const weekOf=iso=>Math.min(NW,Math.max(1,Math.floor(dayDiff(iso,START_ISO)/7)+1));
const SESSIONS=(()=>{const a=[];for(let d=START_ISO;d<=END_ISO;d=addDays(d,1)) if(dowOf(d)!==6)a.push(d);return a})();
const sessionNo=iso=>SESSIONS.indexOf(iso)+1;
const N=SESSIONS.length;
const heDate=iso=>{const p=iso.split('-');return `${+p[2]}.${+p[1]}`};
const DOWN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const WEEKNOTE={1:'כמו בטבלה. הסט הראשון הוא הכיול',2:'פלוס 2 חזרות כמעט בכל תחנה, וברביעי 45 שנ׳ חבל',3:'סווינג יד אחת עם קטלבל 8, לאנג׳ קפיצה, שכיבות טמפו',
  4:'פורמטים חדשים על אותם משקלים: סולם, אינטרוולים, טמפו, טבטה',
  5:'צפיפות: יותר עבודה באותן 10 דקות, פחות מנוחה',

/* speak a cue: ids = recorded clips played back to back, text = what the phone voice says if any of them is missing */
function speak(ids,text){
  hush(); const g=voxGen;
  ids=(ids||[]).filter(Boolean);
  if(!AC||!ids.length||!ids.every(id=>CLIPSET.has(id))){ note('tts',ids,text); tts(text); return; }
  const late=new Promise(r=>setTimeout(()=>r(null),1500));
  Promise.race([Promise.all(ids.map(getBuf)),late]).then(bs=>{
    if(g!==voxGen) return;
    if(!bs||bs.some(b=>!b)){ note('tts',ids,text); tts(text); return; }
    let t=AC.currentTime+.05;
    bs.forEach(b=>{ const s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(t); VOX.push(s); t+=b.duration+.12; });
    voxEnd=t; note('clip',ids,text);
  });
}
/* a short clip on top (countdown, round tap): only when it is already loaded and Marcus is not mid-sentence */
function blip(id){
  if(!AC||!BUF[id]||voxBusy()) return false;
  const s=AC.createBufferSource(); s.buffer=BUF[id]; s.connect(AC.destination); s.start(); VOX.push(s);
  voxEnd=AC.currentTime+BUF[id].duration; note('blip',[id],''); return true;
}
const FIXED=['start','cool','half','last','rest','go','n3','n2','n1','r2','r3','r4','r5','rd1','rd2','rd3','rd4','rd5',
  'blockb','done','donetest','donelast','stamp','stampfri','swapon','swapoff'];
/* everything one session can say, fetched ahead so the first word is not late */
function sessionClips(dow,wk){
  const plan=dayPlan(dow,wk); if(!plan) return [];
  const ids=new Set(FIXED); ids.add(plan.intro);
  daySegments(dow,wk).forEach(s=>s.items.forEach(it=>{ ids.add(lineId(it)); ids.add('m-'+it.m);
    const sw=disp(it,true,wk); if(sw!==it){ ids.add(lineId(sw)); ids.add('m-slbridge'); } }));
  return [...ids];
}

/* ================== streak (Saturday is rest and never breaks it) ================== */
function streak(){
  const t=todayStr(); let d=t, s=0;
  for(let i=0;i<80;i++){
    if(dowOf(d)!==6){ if(S.days[d]) s++; else if(d!==t) break; }
    d=addDays(d,-1);
  }
  return s;
}

/* — dashboard: the numbers behind the streak, and the friday test line — */
const FRIDAYS=SESSIONS.filter(d=>dowOf(d)===5);
function testChart(){
  const es=FRIDAYS.map((d,i)=>({i,r:S.days[d]})).filter(e=>scoreVal(e.r)!=null);
  if(!es.length) return `<p class="dashempty">עוד אין מבחן רשום. הראשון מחכה בשישי 13.11, בסוף האימון.</p>`;
  const W=300,H=110,pad=40;
  const vs=es.map(e=>scoreVal(e.r)), min=Math.min(...vs)-0.5, max=Math.max(...vs)+0.5;
  const x=i=>pad+(i/(FRIDAYS.length-1))*(W-pad*2);
  const y=v=>H-18-((v-min)/(max-min))*(H-40);
  const pts=es.map(e=>`${x(e.i)},${y(scoreVal(e.r))}`).join(' ');
  const dots=es.map(e=>`<circle cx="${x(e.i)}" cy="${y(scoreVal(e.r))}" r="4" fill="${OR}"/>
    <text x="${x(e.i)}" y="${y(scoreVal(e.r))-9}" text-anchor="middle" font-size="12" fill="${CH}" font-family="Secular One">${scoreTxt(e.r)}</text>`).join('');
  const grid=FRIDAYS.map((d,i)=>`<path d="M${x(i)} 14 L${x(i)} ${H-16}" stroke="#ece5d41c" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="10" fill="#8fa39d">${heDate(d)}</text>`).join('');
  return `<div class="wchart"><svg viewBox="0 0 ${W} ${H}">${grid}
    <polyline points="${pts}" fill="none" stroke="${TQ}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}</svg></div>`;
}
function stateCode(){
  const done=SESSIONS.filter(d=>S.days[d]).length;
  const fr=FRIDAYS.map(d=>S.days[d]&&S.days[d].rounds!=null?scoreTxt(S.days[d]):'-').join('/');
  return ['B0820','k'+done,'r'+streak(),'w'+weekOf(todayStr()),'f'+fr,'u'+todayStr()].join(' ');
}
function copyCode(){
  const tx=stateCode(), el=document.getElementById('b0820code');
  const ok=()=>{ if(el)el.textContent=tx+'  ✓'; };

}
function dash(){

  const bonus=Object.keys(S.days).length-done;

  app.innerHTML=`

    <p class="sub">המספרים מאחורי הרצף · שבוע ${weekOf(t)} מתוך ${NW}${no?' · אימון '+no+' מתוך '+N:''}</p>

}

/* — library: every move in the box, by day, with the week it opens — */
function lib(){
  const curWeek=weekOf(todayStr());
  const line=(mk,wkOpen,accent)=>{ const m=MOVES[mk], open=wkOpen<=curWeek;
    return `<div class="exline ${open?'':'dimmed'}">

    </div>`; };
  const uniq=arr=>[...new Set(arr)];
  let count=new Set();
  const dayGroups=[0,1,2,3,4,5].map(dw=>{
    const first={};
    for(let w=1;w<=NW;w++) dayPlan(dw,w).items.forEach(it=>{ if(it.m!=='rest'&&!(it.m in first)) first[it.m]=w; });
    Object.keys(first).forEach(k=>count.add(k));
    return `<div class="libgroup"><h3>${DOWN[dw]} · ${DAYS[dw].name} <small>${DAYS[dw].short}</small></h3>

  }).join('');
  const warm=uniq(WARM.map(x=>x[0].m)), cool=uniq(COOL.map(x=>x[0].m));
  warm.concat(cool,['slbridge']).forEach(k=>count.add(k));
  const dtypes=[0,1,2,3,4,5].map(dw=>{ const p=dayPlan(dw,curWeek);
    return `<div class="dtypeline"><i>${'אבגדהו'[dw]}.</i><b>${p.name}</b><span>${p.sub}</span><span class="secs">${p.short}</span></div>`; }).join('');
  const notes=Object.keys(WEEKNOTE).map(w=>`שבוע ${w}: ${WEEKNOTE[w]}.`).join(' ');
  app.innerHTML=`
  <header class="lid"><i class="frame"></i>
    <div class="collide"><span class="n30">${count.size}</span><span class="word" style="font-size:44px">הספרייה</span></div>
    <p class="sub">כל מה שבקופסת 08:20 · אתה בשבוע ${curWeek} מתוך ${NW}</p>
    <span class="edition">חבל, קטלבל 12 ו-8, שני דמבלס, כדור טניס</span>
  </header>

  <section class="slip"><i class="rip"></i>
    <div class="today-head"><div class="dtype"><b>מבנה השבוע הזה</b><span>שישה ימים, ראשון עד שישי. שבת מנוחה</span></div></div>
    <hr class="dashline">
    ${dtypes}
    <p class="peeknote">כל אימון: 3 דקות חימום בחבל, 10 דקות עבודה, 2 דקות שחרור עם כדור טניס. ${notes} לחיצה על יום בסולם מראה בדיוק מה מחכה בו.</p>
  </section>

  <section style="margin:6px 12px 0; padding:0 8px">
    <div class="libgroup"><h3>חימום <small>3 דקות, זהה כל יום</small></h3>${warm.map(k=>line(k,1,OR)).join('')}</div>
    ${dayGroups}
    <div class="libgroup"><h3>שחרור <small>2 דקות, כדור טניס</small></h3>${cool.map(k=>line(k,1,OR)).join('')}</div>
    <div class="libgroup"><h3>חוק המרפק <small>במקום סווינג וחתירה</small></h3>${line('slbridge',1,OR)}
      ${Object.keys(BRIDGE).map(w=>`<div class="statrow"><span>שבוע ${w}</span><b class="${+w===curWeek?'orv':''}">${BRIDGE[w]}</b></div>`).join('')}
      <p class="peeknote">המינון שמרקוס קבע לגשר. אותו זמן עבודה כמו הסווינג או החתירה שהוא מחליף. באימוני זמן: כל האינטרוול, מחליפים רגל באמצע.</p></div>
  </section>`;
}
</script>

<script id="player-code">
/* ================== player ==================
   same screens as challenge 30. the clock runs on wall time: every segment end is chained
   to the previous one, so 15:00 stays 15:00 even when the phone throttles the tab. */
const P=document.getElementById('player');
let T={segs:[],i:0,left:0,end:0,iv:null}, paused=false, WL=null;
async function wake(on){
  try{
    if(on){ if('wakeLock' in navigator&&!WL){ WL=await navigator.wakeLock.request('screen'); WL.onrelease=()=>{WL=null}; } }
    else if(WL){ WL.release(); WL=null; }
  }catch(e){}
}
function startDay(){
  ensureAudio(); tts(' ');
  const t=todayStr(), dow=dowOf(t); if(dow===6||t>END_ISO)return;
  const wk=weekOf(t);
  T={date:t,dow,wk,plan:dayPlan(dow,wk),segs:daySegments(dow,wk),i:-1,left:0,end:Date.now(),iv:null,rounds:0,swap:swapToday(),spoke:{},heard:{}};
  paused=false;
  P.classList.add('on'); wake(true);
  sessionClips(dow,wk).forEach(getBuf);   /* decode today's clips now that the tap opened the audio */
  nextSeg(false);
  T.iv=setInterval(tick,250);
}
const segItems=s=>s.items.map(it=>disp(it,T.swap,T.wk));
function segSpeech(s){ return segItems(s).map(it=>it.t).join('. '); }
/* what Marcus says when a segment opens. full line the first time, just the move name after that */
function cue(){
  const s=T.segs[T.i], p=T.segs[T.i-1], its=segItems(s), line=segSpeech(s);
  const lines=its.map(lineId), first=!T.heard[line]; T.heard[line]=1;
  if(T.i===0) return speak(['start',...lines],`בוא נתחיל. שלוש דקות חימום. ${line}`);
  if(s.kind==='work'&&p.kind!=='work') return speak([T.plan.intro,...lines],`עשר דקות עבודה. ${T.plan.name}. ${line}`);
  if(s.kind==='cool'&&p.kind!=='cool') return speak(['cool',...lines],`סיימת את העבודה. שתי דקות שחרור. ${line}`);
  if(s.rest&&s.secs<=20) return speak(['rest'],'מנוחה');
  if(s.quiet) return speak(['go'],'קדימה');
  if(s.second) return speak(['blockb',...lines],`בלוק שני. ${line}`);
  if(s.rn>1) return speak(['r'+s.rn],s.rn===5?'סבב אחרון':'סבב '+s.rn);
  if(first||its.length>1) return speak(lines,line);
  speak(['m-'+its[0].m],MOVES[its[0].m].n);
}
function nextSeg(quiet){
  T.i++;
  if(T.i>=T.segs.length){ finish(); return false; }
  const s=T.segs[T.i];
  T.end+=s.secs*1000; T.left=s.secs; T.spoke={};
  P.classList.toggle('rest',s.kind==='cool'||!!s.rest);
  if(!quiet){ if(s.kind==='cool') beep(520,.2); else beep(980,.12); cue(); }
  paint();
  return true;
}
function totalLeft(){
  let rest=0; for(let k=T.i+1;k<T.segs.length;k++) rest+=T.segs[k].secs;
  return Math.max(0,Math.ceil((T.end-Date.now())/1000))+rest;
}
function tick(){
  if(paused||!T.iv) return;
  const now=Date.now();
  while(now>=T.end){
    const nx=T.segs[T.i+1];
    /* waking up late (tab was frozen): run through the missed segments silently, speak only the live one */
    if(!nextSeg(!!nx&&now>=T.end+nx.secs*1000)) return;
  }
  const left=Math.ceil((T.end-now)/1000);
  if(left!==T.left){ T.left=left; onSecond(); }
}
function onSecond(){
  const s=T.segs[T.i], left=T.left;
  if(left<=3&&left>0&&!T.spoke['b'+left]){ T.spoke['b'+left]=1; beep(left===1?1200:800,.09,.25);
    /* Marcus counts the last three seconds out loud, on segments long enough to carry it */
    if(s.secs>=30){ if(T.spoke.cd===undefined) T.spoke.cd=!voxBusy(); if(T.spoke.cd) blip('n'+left); } }
  if(s.amrap){
    if(s.secs===600&&left<=300&&left>240&&!T.spoke.h){ T.spoke.h=1; speak(['half'],'חצי. חמש דקות נשארו.'); }
    if(left<=60&&left>30&&!T.spoke.m){ T.spoke.m=1; speak(['last'],'דקה אחרונה. תן הכל.'); }
  }
  const c=document.getElementById('pcount'); if(c)c.textContent=s.secs>99?fmtClock(left):left;
  const tot=totalSecs(T.segs), tl=totalLeft();
  const tp=document.getElementById('ptape'); if(tp)tp.style.width=((tot-tl)/tot*100)+'%';
  const pt=document.getElementById('ptot'); if(pt)pt.textContent='נשאר '+fmtClock(tl);
}
function paint(){
  const s=T.segs[T.i], nxt=T.segs[T.i+1];
  const items=segItems(s);
  const grip=s.items.some(it=>MOVES[it.m].grip);
  const nx1=nxt&&disp(nxt.items[0],T.swap,T.wk);
  const acc=s.kind==='cool'?OR:TQ;
  const tot=totalSecs(T.segs), tl=totalLeft();
  let body;
  if(items.length===1){
    const it=items[0], m=MOVES[it.m];
    body=`<div class="pex">${it.t}</div>
    <div class="pcue">${m.cue}</div>
    ${m.v&&VIDS[m.v]?`<button class="pdemo" onclick="playerVid('${m.v}')">הדגמה בווידאו</button>`:''}
    <div class="pfig">${figSvg(m.f,acc)}</div>`;
  } else {
    body=`<div class="pex" style="font-size:24px">${s.title}</div>
    <div class="plist">${items.map(it=>{ const m=MOVES[it.m];
      return `<div class="exline"><span class="fig">${figSvg(m.f,acc)}</span>
        <div class="xtxt"><b>${it.t}</b><span>${m.cue}</span></div>
        ${m.v&&VIDS[m.v]?`<span class="playtag" onclick="playerVid('${m.v}')">${playSvg}</span>`:''}</div>`; }).join('')}</div>
    ${s.amrap?`<button class="roundbtn" onclick="addRound()"><span>${s.cl||'סיימתי סבב'}</span><b id="prounds">${T.rounds}</b></button>`:''}`;
  }
  P.innerHTML=`<div class="halo"></div>
  <div class="ptop"><span>${T.plan.name} · ${s.tag}</span><span class="ptot" id="ptot">נשאר ${fmtClock(tl)}</span><button class="quit" onclick="quitDay()">יציאה</button></div>
  <div class="ptape"><i id="ptape" style="width:${(tot-tl)/tot*100}%"></i></div>
  <div class="pmain">
    <div class="pcount ${s.secs>99?'long':''}" id="pcount">${s.secs>99?fmtClock(T.left):T.left}</div>
    ${body}
    ${grip?`<button class="elbow" onclick="swapNow()">${T.swap?'המרפק בסדר? חזרה לסווינג ולחתירה':'המרפק מאותת? מחליפים לגשר רגל אחת'}</button>`:''}
    <div class="pnext"><span>הבא בתור</span><span>${nxt?(nxt.items.length>1?nxt.title:nx1.t):'חותמת'}</span></div>
  </div>
  <div class="pbtns">
    <button onclick="skipSeg()">דלג</button>
    <button class="go" onclick="pauseSeg()">${paused?'המשך':'עצור רגע'}</button>
  </div>`;
}
function addRound(){ T.rounds++; beep(1320,.08,.2); const b=document.getElementById('prounds'); if(b)b.textContent=T.rounds;
  blip('rd'+((T.rounds-1)%5+1)); }
function swapNow(){
  T.swap=!T.swap; S.swap=T.swap?T.date:null; DB.save(S);
  if(T.swap) T.swapUsed=true;
  paint();
  const s=T.segs[T.i], its=segItems(s), line=segSpeech(s);
  if(T.swap) speak(['swapon',...its.filter(it=>it.swapped).map(lineId)],`המרפק קודם. ${its.filter(it=>it.swapped).map(it=>it.t).join('. ')}`);
  else speak(['swapoff',...its.map(lineId)],`המרפק בסדר. ${line}`);
}
function holdSeg(){ if(paused)return; paused=true; T.rem=T.end-Date.now(); clearInterval(T.iv); T.iv=null;
  const b=document.querySelector('.pbtns .go'); if(b)b.textContent='המשך'; }
function resumeSeg(){ if(!paused)return; paused=false; T.end=Date.now()+T.rem; T.iv=setInterval(tick,250); wake(true);
  const b=document.querySelector('.pbtns .go'); if(b)b.textContent='עצור רגע'; }
function pauseSeg(){ if(paused) resumeSeg(); else holdSeg(); }
function skipSeg(){
  if(paused){ paused=false; T.iv=setInterval(tick,250); }
  T.end=Date.now();
  nextSeg(false);
}
function quitDay(){ if(T.iv)clearInterval(T.iv); T.iv=null; paused=false; wake(false); P.classList.remove('on'); P.innerHTML=''; home(); }
/* the screen came back: take the wake lock again and catch the clock up at once */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&T.iv){ wake(true); tick(); } });

/* ================== done + type-to-unlock stamp ================== */
const D=document.getElementById('done');
function finish(){
  if(T.iv)clearInterval(T.iv); T.iv=null; wake(false);
  P.classList.remove('on'); P.innerHTML='';
  beep(880,.15); setTimeout(()=>beep(1100,.15),160); setTimeout(()=>beep(1320,.25),330);
  const test=T.plan.test, am=T.plan.count, unit=T.plan.unit;
  const no=sessionNo(T.date), swapped=T.swap||T.swapUsed, lastOne=no===N;
  if(lastOne) speak(['donelast'],'זהו, הקופסה סגורה. שלושים ושישה אימונים. אני בונה לך את הבאה.');
  else if(test) speak(['donetest'],'חמש עשרה דקות. רשום את הסבבים, ולמקלחת.');
  else speak(['done'],'חמש עשרה דקות. זהו. מקלחת וקפה, יש לך עד תשע.');
  D.classList.add('on');
  D.innerHTML=`<div class="donewrap"><div class="slip"><i class="rip"></i>
    <h2 style="font-size:26px">קבלה · ${DOWN[T.dow]} ${heDate(T.date)}</h2>
    <div class="bigstamp" id="bigstamp">${stampSvg('הוחתם')}</div>
    <div class="sumline"><span>אימון</span><b>${T.plan.name}${no?' · '+no+' מתוך '+N:''}</b></div>
    <div class="sumline"><span>שבוע</span><b>${T.wk} מתוך ${NW}</b></div>
    <div class="sumline"><span>זמן</span><b>15:00 דק׳</b></div>
    ${swapped?`<div class="sumline"><span>מרפק</span><b>הוחלף לגשר רגל אחת</b></div>`:''}
    ${am?`<div class="extra"><span style="min-width:104px">${test?'תוצאת המבחן':unit+' היום'}</span>
      <input class="wide" inputmode="numeric" id="rnd" placeholder="${unit}" value="${T.rounds||''}" oninput="sigCheck()">
      <span>ועוד</span>
      <input class="wide" inputmode="numeric" id="rps" placeholder="חזרות"></div>
      ${test?`<p class="scorenote">שישי הוא המדד. בלי מספר סבבים אין חותמת.</p>`:''}`:''}
    <div class="signrow">
      <label>הסולם סופר רק את מי שחותם. חתום כאן:</label>
      <input id="sig" autocomplete="off" placeholder="השם שלך" oninput="sigCheck()">
    </div>
    <button class="stampbtn" id="stampbtn" onclick="stampDay()">החתם את היום</button>
    <div class="confetti-note" id="cnote"></div>
    <button class="backhome" onclick="closeDone()">חזרה לקופסה</button>
  </div></div>`;
}
function sigCheck(){
  const sig=document.getElementById('sig').value.trim(), rnd=document.getElementById('rnd');
  const needScore=T.plan.test&&!(rnd&&rnd.value.trim()!==''&&!isNaN(parseFloat(rnd.value)));
  document.getElementById('stampbtn').classList.toggle('ready',sig.length>=2&&!needScore);
}
function stampDay(){
  const sig=document.getElementById('sig').value.trim(); if(sig.length<2)return;
  const rnd=document.getElementById('rnd'), rps=document.getElementById('rps');
  const rec={date:T.date,sig,dow:T.dow,wk:T.wk,swap:!!(T.swap||T.swapUsed)};
  if(rnd&&rnd.value.trim()!==''&&!isNaN(parseFloat(rnd.value))){ rec.rounds=parseFloat(rnd.value); rec.reps=rps&&parseInt(rps.value)||0;
    if(T.plan.unit!=='סבבים') rec.unit=T.plan.unit; }
  if(T.plan.test&&rec.rounds==null) return;
  S.days[T.date]=rec;
  if(!S.start)S.start=T.date;
  DB.save(S);
  document.getElementById('bigstamp').classList.add('show');
  document.getElementById('stampbtn').style.visibility='hidden';
  document.getElementById('cnote').textContent=`נרשמת בסולם, ${sig}. רצף: ${streak()} ימים. מקלחת וקפה, יש לך עד 09:00.`;
  beep(660,.3,.35);
  if(sessionNo(T.date)!==N){ hush(); getBuf(T.dow===5?'stampfri':'stamp').then(()=>blip(T.dow===5?'stampfri':'stamp')); }
}
function closeDone(){ D.classList.remove('on'); D.innerHTML=''; home(); }

/* ================== boot ================== */
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{HEV=undefined};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
